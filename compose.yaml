services:
  ollama:
    image: ollama/ollama:0.6.8
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
    volumes:
      - models:/root/.ollama
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24
  novix:
    build: .
    network_mode: service:ollama
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./data:/app/data
volumes:
  models:
